server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Relativa Location-headers. Utan detta bygger nginx absoluta adresser ur
    # containerns egen vy (port 8080, http) och nedgraderar besökaren till
    # klartext mitt i ett https-besök.
    absolute_redirect off;

    # Sub-path-spegel. Portalens nginx strippar /app/tankkoll innan
    # requesten når hit, men origin-monitorn och den som går direkt på
    # värdporten gör det inte. Båda stavningarna, med och utan avslutande
    # snedstreck.
    rewrite ^/app/tankkoll/?$ / last;
    rewrite ^/app/tankkoll/(.*)$ /$1 last;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json application/manifest+json
                      image/svg+xml;

    # add_header ärvs INTE till ett location-block som självt deklarerar
    # någon add_header. Därför upprepas säkerhetsheadrarna i varje block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Servicearbetaren måste alltid hämtas färsk – annars kan en gammal
    # cachad version av sw.js hindra nya versioner från att nå besökare.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fingeravtryckta byggartefakter – säkert att cacha för evigt.
    location /_next/static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # $uri/index.html före en bar katalogvariant: annars bygger nginx en
        # katalogomdirigering ur den redan förkortade sökvägen och lämnar
        # /app/tankkoll helt.
        try_files $uri $uri/index.html /index.html;
    }
}
